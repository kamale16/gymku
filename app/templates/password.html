{% extends 'base.html' %}
{% block title %}Ganti password - GymKu{% endblock %}
{% block body %}
<section class="narrow">
  <h1>Ganti password</h1>
  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf() }}">
    <label>Password lama <input name="old" type="password" required></label>
    <label>Password baru (minimal 6 karakter) <input name="new" type="password" required minlength="6"></label>
    <label>Ulangi password baru <input name="confirm" type="password" required></label>
    <button>Simpan password</button>
  </form>
</section>
{% endblock %}
